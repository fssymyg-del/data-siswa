
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biodata Siswa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #eef2f7;
  --kartu: #ffffff;
  --teks: #14213d;
  --teks-redup: #5b667a;
  --garis: #d6dde8;
  --aksen: #f97316;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1522;
    --kartu: #172033;
    --teks: #e8edf6;
    --teks-redup: #98a4ba;
    --garis: #2a3650;
    --aksen: #fb923c;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--teks);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}

.wadah {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

header h1 {
  margin: 0 0 4px;
  font-size: 1.75rem;
  font-weight: 800;
}

header p {
  margin: 0;
  color: var(--teks-redup);
}

.kontrol {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 20px 0 8px;
}

.kontrol input,
.kontrol select {
  font: inherit;
  color: var(--teks);
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 10px;
  padding: 10px 12px;
}

.kontrol input {
  flex: 1 1 220px;
  min-width: 0;
}

.kontrol select {
  flex: 0 1 160px;
  max-width: 100%;
}

.kontrol input:focus-visible,
.kontrol select:focus-visible {
  outline: 2px solid var(--aksen);
  outline-offset: 1px;
}

.jumlah {
  color: var(--teks-redup);
  font-size: 0.9rem;
  margin: 0 0 16px;
}

.daftar {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 16px;
}

.kartu {
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 14px;
  overflow: hidden;
}

.pita {
  height: 56px;
  background: #f97316;
}

.isi {
  padding: 0 16px 16px;
  text-align: center;
}

.foto {
  width: 76px;
  height: 76px;
  margin: -38px auto 8px;
  border-radius: 50%;
  border: 4px solid var(--kartu);
  background: #ffedd5;
  color: #c2410c;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 1.5rem;
  overflow: hidden;
}

.foto img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.nama {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 800;
}

.nis {
  margin: 0 0 12px;
  color: var(--teks-redup);
  font-size: 0.85rem;
}

.rincian {
  margin: 0;
  text-align: left;
  font-size: 0.9rem;
}

.rincian div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0;
  border-top: 1px solid var(--garis);
}

.rincian dt {
  color: var(--teks-redup);
}

.rincian dd {
  margin: 0;
  font-weight: 600;
  text-align: right;
  overflow-wrap: anywhere;
}

.pesan {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px 16px;
  color: var(--teks-redup);
}

.pesan.galat {
  color: #b42318;
}

@media (prefers-color-scheme: dark) {
  .pesan.galat {
    color: #ff8b80;
  }
}
</style>
</head>

<body>
<div class="wadah">
  <header>
    <h1>Teknik jaringan komputer</h1>
    <p>Cari siswa berdasarkan role.</p>
  </header>

  <div class="kontrol">
    <input
      id="cari"
      type="search"
      placeholder="Cari nama atau NIS..."
      aria-label="Cari nama atau NIS"
    >

    <select id="filterrole" aria-label="Filter guru atau siswa">
      <option value="">Semua peran</option>
      <option value="Guru">Guru</option>
      <option value="Siswa">Siswa</option>
    </select>

    <select id="filterKelas" aria-label="Filter kelas">
      <option value="">Semua kelas</option>
    </select>

    <select id="filterMapel" aria-label="Filter mata pelajaran">
      <option value="">Semua mapel</option>
    </select>
  </div>

  <p id="jumlah" class="jumlah" aria-live="polite"></p>
  <main id="daftar" class="daftar"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
// --- KONFIGURASI SUPABASE ---
const SUPABASE_URL = "https://qdfurcqsnmajtvkjkdda.supabase.co";

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhbGciOiJIUzI1NiIsInJlZiI6InFkZnVyY3Fzbm1hanR2a2prZGRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTU5NTgsImV4cCI6MjEwNzQ3MTk1OH0.E_pNE3t26Sr7xe3dIdvk7gwbDVWPsa9iejl795BV-os";

const TAMPILKAN = {
  jenisKelamin: true,
  tanggalLahir: true,
  alamat: true,
  foto_url: true,
  nama_guru: true,
  mata_pelajaran: true
};

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const elDaftar = document.getElementById("daftar");
const elJumlah = document.getElementById("jumlah");
const elCari = document.getElementById("cari");
const elRole = document.getElementById("filterrole");
const elKelas = document.getElementById("filterKelas");
const elMapel = document.getElementById("filterMapel");

let semuaSiswa = [];

async function muatData() {
  tampilkanPesan("Memuat data siswa...");

  try {
    // Kolom role dan mapel ikut diambil untuk kebutuhan filter.
    const { data, error } = await db
      .from("siswa")
      .select("nis, nama, kelas, role, mapel, jenis_kelamin, tanggal_lahir, alamat, foto_url")
      .order("nama");

    if (error) {
      console.error("Detail Error Supabase:", error);
      tampilkanPesan(
        "Gagal memuat data: " + error.message,
        true
      );
      return;
    }

    semuaSiswa = data || [];

    isiPilihanKelas();
    isiPilihanMapel();
    tampilkanSiswa();

    console.log("Jumlah data yang berhasil dimuat:", semuaSiswa.length);
  } catch (error) {
    console.error("Kesalahan koneksi:", error);
    tampilkanPesan(
      "Terjadi kesalahan koneksi. Periksa koneksi internet dan konfigurasi Supabase.",
      true
    );
  }
}

function tampilkanSiswa() {
  const kataKunci = elCari.value.trim().toLowerCase();
  const roleDipilih = elRole.value;
  const kelasDipilih = elKelas.value;
  const mapelDipilih = elMapel.value;

  const hasil = semuaSiswa.filter((s) => {
    const nama = String(s.nama || "").toLowerCase();
    const nis = String(s.nis || "").toLowerCase();
    const role = String(s.role || "").toLowerCase();
    const kelas = String(s.kelas || "");
    const mapel = String(s.mapel || "");

    const cocokCari =
      !kataKunci ||
      nama.includes(kataKunci) ||
      nis.includes(kataKunci);

    const cocokRole =
      !roleDipilih ||
      role === roleDipilih.toLowerCase();

    const cocokKelas =
      !kelasDipilih ||
      kelas === kelasDipilih;

    const cocokMapel =
      !mapelDipilih ||
      mapel === mapelDipilih;

    return cocokCari && cocokRole && cocokKelas && cocokMapel;
  });

  elJumlah.textContent =
    hasil.length + " dari " + semuaSiswa.length + " data";

  elDaftar.replaceChildren();

  if (hasil.length === 0) {
    tampilkanPesan(
      semuaSiswa.length === 0
        ? "Belum ada data yang bisa ditampilkan."
        : "Tidak ada data yang cocok. Coba ubah pencarian atau filter."
    );
    return;
  }

  hasil.forEach((s) => {
    elDaftar.appendChild(buatKartu(s));
  });
}

function buatKartu(s) {
  const kartu = el("article", "kartu");
  kartu.appendChild(el("div", "pita"));

  const isi = el("div", "isi");
  const foto = el("div", "foto");

  if (s.foto_url) {
    const gambar = document.createElement("img");
    gambar.src = s.foto_url;
    gambar.alt = "Foto " + (s.nama || "siswa");
    gambar.loading = "lazy";

    gambar.onerror = () => {
      foto.replaceChildren(
        document.createTextNode(inisial(s.nama))
      );
    };

    foto.appendChild(gambar);
  } else {
    foto.textContent = inisial(s.nama);
  }

  isi.appendChild(foto);
  isi.appendChild(el("h2", "nama", s.nama || "Tanpa nama"));
  isi.appendChild(el("p", "nis", "NIS " + (s.nis || "-")));

  const rincian = el("dl", "rincian");

  // Menampilkan peran jika tersedia.
  tambahBaris(rincian, "Peran", s.role);

  if (s.role && String(s.role).toLowerCase() === "guru") {
    tambahBaris(rincian, "Mata pelajaran", s.mapel);
  } else {
    tambahBaris(rincian, "Kelas", s.kelas);
  }

  if (TAMPILKAN.jenisKelamin) {
    tambahBaris(rincian, "Jenis kelamin", s.jenis_kelamin);
  }

  if (TAMPILKAN.tanggalLahir) {
    tambahBaris(
      rincian,
      "Tanggal lahir",
      formatTanggal(s.tanggal_lahir)
    );
  }

  if (TAMPILKAN.alamat) {
    tambahBaris(rincian, "Alamat", s.alamat);
  }

  isi.appendChild(rincian);
  kartu.appendChild(isi);

  return kartu;
}

function el(tag, kelas, teks) {
  const e = document.createElement(tag);

  if (kelas) {
    e.className = kelas;
  }

  if (teks !== undefined && teks !== null) {
    e.textContent = teks;
  }

  return e;
}

function tambahBaris(dl, label, nilai) {
  if (
    nilai === null ||
    nilai === undefined ||
    String(nilai).trim() === ""
  ) {
    return;
  }

  const baris = el("div");
  baris.appendChild(el("dt", "", label));
  baris.appendChild(el("dd", "", String(nilai)));
  dl.appendChild(baris);
}

function inisial(nama) {
  return String(nama || "?")
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((k) => k[0].toUpperCase())
    .join("");
}

function formatTanggal(teks) {
  if (!teks) return "";

  const tanggal = new Date(teks + "T00:00:00");

  if (Number.isNaN(tanggal.getTime())) {
    return teks;
  }

  return tanggal.toLocaleDateString("id-ID", {
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

function tampilkanPesan(teks, galat = false) {
  elDaftar.replaceChildren(
    el("p", "pesan" + (galat ? " galat" : ""), teks)
  );
}

function isiPilihanKelas() {
  const pilihanLama = elKelas.value;

  elKelas.replaceChildren(
    el("option", "", "Semua kelas")
  );
  elKelas.options[0].value = "";

  const daftarKelas = [
    ...new Set(
      semuaSiswa
        .map((s) => s.kelas)
        .filter((k) => k !== null && k !== undefined && String(k).trim() !== "")
        .map(String)
    )
  ].sort();

  daftarKelas.forEach((kelas) => {
    const opsi = el("option", "", kelas);
    opsi.value = kelas;
    elKelas.appendChild(opsi);
  });

  elKelas.value = pilihanLama;
}

function isiPilihanMapel() {
  const pilihanLama = elMapel.value;

  elMapel.replaceChildren(
    el("option", "", "Semua mapel")
  );
  elMapel.options[0].value = "";

  const daftarMapel = [
    ...new Set(
      semuaSiswa
        .map((s) => s.mapel)
        .filter((m) => m !== null && m !== undefined && String(m).trim() !== "")
        .map(String)
    )
  ].sort();

  daftarMapel.forEach((mapel) => {
    const opsi = el("option", "", mapel);
    opsi.value = mapel;
    elMapel.appendChild(opsi);
  });

  elMapel.value = pilihanLama;
}

elCari.addEventListener("input", tampilkanSiswa);
elRole.addEventListener("change", tampilkanSiswa);
elKelas.addEventListener("change", tampilkanSiswa);
elMapel.addEventListener("change", tampilkanSiswa);

muatData();
</script>
</body>
  </html>
