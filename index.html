
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biodata Guru dan Siswa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #eef2f7;
  --kartu: #ffffff;
  --teks: #14213d;
  --teks-redup: #5b667a;
  --garis: #d6dde8;
  --aksen: #f97316;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1522;
    --kartu: #172033;
    --teks: #e8edf6;
    --teks-redup: #98a4ba;
    --garis: #2a3650;
    --aksen: #fb923c;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--teks);
  font-family: "Plus Jakarta Sans", system-ui, sans-serif;
  line-height: 1.5;
}

.wadah {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

header h1 {
  margin: 0 0 4px;
  font-size: 1.75rem;
  font-weight: 800;
}

header p { margin: 0; color: var(--teks-redup); }

.kontrol {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 20px 0 8px;
}

.kontrol input,
.kontrol select {
  font: inherit;
  color: var(--teks);
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 10px;
  padding: 10px 12px;
  min-width: 0;
}

.kontrol input { flex: 1 1 220px; }
.kontrol select { flex: 1 1 150px; }

.kontrol input:focus-visible,
.kontrol select:focus-visible {
  outline: 2px solid var(--aksen);
  outline-offset: 1px;
}

.jumlah {
  color: var(--teks-redup);
  font-size: 0.9rem;
  margin: 0 0 16px;
}

.daftar {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 16px;
}

.kartu {
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 14px;
  overflow: hidden;
}

.pita { height: 56px; background: #f97316; }

.kartu.guru .pita { background: #2563eb; }

.isi { padding: 0 16px 16px; text-align: center; }

.foto {
  width: 76px;
  height: 76px;
  margin: -38px auto 8px;
  border-radius: 50%;
  border: 4px solid var(--kartu);
  background: #ffedd5;
  color: #c2410c;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 1.5rem;
  overflow: hidden;
}

.foto img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.nama { margin: 0; font-size: 1.05rem; font-weight: 800; }

.nis {
  margin: 0 0 8px;
  color: var(--teks-redup);
  font-size: 0.85rem;
}

.label-role {
  display: inline-block;
  margin: 0 0 12px;
  padding: 4px 10px;
  border-radius: 20px;
  background: #ffedd5;
  color: #9a3412;
  font-size: 0.78rem;
  font-weight: 800;
}

.guru .label-role {
  background: #dbeafe;
  color: #1d4ed8;
}

.rincian {
  margin: 0;
  text-align: left;
  font-size: 0.9rem;
}

.rincian div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0;
  border-top: 1px solid var(--garis);
}

.rincian dt { color: var(--teks-redup); }

.rincian dd {
  margin: 0;
  font-weight: 600;
  text-align: right;
  overflow-wrap: anywhere;
}

.pesan {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px 16px;
  color: var(--teks-redup);
}

.pesan.galat { color: #b42318; }

@media (prefers-color-scheme: dark) {
  .pesan.galat { color: #ff8b80; }
}

@media (max-width: 480px) {
  .wadah { padding: 20px 12px 36px; }
  .daftar { grid-template-columns: 1fr; }
  .kontrol select { flex: 1 1 100%; }
}
</style>
</head>

<body>
<div class="wadah">

  <header>
    <h1>Biodata Guru dan Siswa</h1>
    <p>Cari berdasarkan nama atau NIS, lalu pilih kategori, kelas, atau mata pelajaran.</p>
  </header>

  <div class="kontrol">
    <input
      id="cari"
      type="search"
      placeholder="Cari nama atau NIS"
      aria-label="Cari nama atau NIS"
    >

    <select id="filterRole" aria-label="Filter guru atau siswa">
      <option value="">Guru / Siswa</option>
      <option value="Guru">Guru</option>
      <option value="Siswa">Siswa</option>
    </select>

    <select id="filterKelas" aria-label="Filter kelas">
      <option value="">Semua kelas</option>
    </select>

    <select id="filterMapel" aria-label="Filter mata pelajaran">
      <option value="">Semua mapel</option>
    </select>
  </div>

  <p id="jumlah" class="jumlah" aria-live="polite"></p>
  <main id="daftar" class="daftar"></main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
// ===== KONFIGURASI SUPABASE =====
const SUPABASE_URL = "https://qdfurcqsnmajtvkjkdda.supabase.co";

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZnVyY3Fzbm1hanR2a2prZGRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTU5NTgsImV4cCI6MjEwNzQ3MTk1OH0.E_pNE3t26Sr7xe3dIdvk7gwbDVWPsa9iejl795BV-os";

const TAMPILKAN = {
  jenisKelamin: true,
  tanggalLahir: true,
  alamat: true,
  foto_url: true
};

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

// ===== ELEMEN HTML =====
const elDaftar = document.getElementById("daftar");
const elJumlah = document.getElementById("jumlah");
const elCari = document.getElementById("cari");
const elRole = document.getElementById("filterRole");
const elKelas = document.getElementById("filterKelas");
const elMapel = document.getElementById("filterMapel");

let semuaData = [];

// ===== MEMUAT DATA SUPABASE =====
async function muatData() {
  tampilkanPesan("Memuat data...");

  const { data, error } = await db
    .from("siswa")
    .select("nis, nama, kelas, role, mapel, jenis_kelamin, tanggal_lahir, alamat, foto_url")
    .order("nama");

  if (error) {
    console.error("Detail error:", error);

    tampilkanPesan(
      "Data tidak bisa dimuat. Periksa kolom tabel, URL, anon key, dan policy RLS Supabase.",
      true
    );
    return;
  }

  semuaData = data || [];

  isiPilihanKelas();
  isiPilihanMapel();
  tampilkanData();
}

// ===== FILTER KELAS =====
function isiPilihanKelas() {
  elKelas.replaceChildren();

  const opsiSemua = el("option", "", "Semua kelas");
  opsiSemua.value = "";
  elKelas.appendChild(opsiSemua);

  const daftarKelas = [
    ...new Set(
      semuaData.map(d => d.kelas).filter(Boolean)
    )
  ].sort((a, b) => a.localeCompare(b, "id"));

  daftarKelas.forEach(kelas => {
    const opsi = el("option", "", kelas);
    opsi.value = kelas;
    elKelas.appendChild(opsi);
  });
}

// ===== FILTER MATA PELAJARAN =====
function isiPilihanMapel() {
  elMapel.replaceChildren();

  const opsiSemua = el("option", "", "Semua mapel");
  opsiSemua.value = "";
  elMapel.appendChild(opsiSemua);

  const daftarMapel = [
    ...new Set(
      semuaData
        .filter(d => normal(d.role) === "guru")
        .map(d => d.mapel)
        .filter(Boolean)
    )
  ].sort((a, b) => a.localeCompare(b, "id"));

  daftarMapel.forEach(mapel => {
    const opsi = el("option", "", mapel);
    opsi.value = mapel;
    elMapel.appendChild(opsi);
  });
}

// ===== MENAMPILKAN DAN MENYARING DATA =====
function tampilkanData() {
  const kataKunci = elCari.value.trim().toLowerCase();
  const roleDipilih = elRole.value;
  const kelasDipilih = elKelas.value;
  const mapelDipilih = elMapel.value;

  const hasil = semuaData.filter(d => {
    const nama = String(d.nama || "").toLowerCase();
    const nis = String(d.nis || "").toLowerCase();
    const roleNormal = normal(d.role);

    const cocokCari =
      !kataKunci ||
      nama.includes(kataKunci) ||
      nis.includes(kataKunci);

    const cocokRole =
      !roleDipilih ||
      roleNormal === normal(roleDipilih);

    const cocokKelas =
      !kelasDipilih ||
      d.kelas === kelasDipilih;

    // Filter mapel berlaku untuk data guru.
    const cocokMapel =
      !mapelDipilih ||
      (roleNormal === "guru" && d.mapel === mapelDipilih);

    return cocokCari && cocokRole && cocokKelas && cocokMapel;
  });

  elJumlah.textContent =
    hasil.length + " dari " + semuaData.length + " data";

  elDaftar.replaceChildren();

  if (hasil.length === 0) {
    tampilkanPesan(
      semuaData.length === 0
        ? "Belum ada data. Tambahkan data melalui Table Editor Supabase."
        : "Data tidak ditemukan. Coba ubah pilihan filter."
    );
    return;
  }

  hasil.forEach(data => {
    elDaftar.appendChild(buatKartu(data));
  });
}

// ===== MEMBUAT KARTU DATA =====
function buatKartu(d) {
  const roleNormal = normal(d.role);
  const isGuru = roleNormal === "guru";

  const kartu = el("article", "kartu" + (isGuru ? " guru" : ""));
  kartu.appendChild(el("div", "pita"));

  const isi = el("div", "isi");
  const foto = el("div", "foto");

  if (TAMPILKAN.foto_url && d.foto_url) {
    const gambar = document.createElement("img");
    gambar.src = d.foto_url;
    gambar.alt = "Foto " + (d.nama || "");
    gambar.loading = "lazy";

    gambar.onerror = () => {
      foto.replaceChildren(
        document.createTextNode(inisial(d.nama))
      );
    };

    foto.appendChild(gambar);
  } else {
    foto.textContent = inisial(d.nama);
  }

  isi.appendChild(foto);
  isi.appendChild(el("h2", "nama", d.nama || "Tanpa nama"));

  isi.appendChild(
    el("p", "nis", (isGuru ? "ID " : "NIS ") + (d.nis || "-"))
  );

  isi.appendChild(
    el("span", "label-role", isGuru ? "Guru" : "Siswa")
  );

  const rincian = el("dl", "rincian");

  if (d.kelas) tambahBaris(rincian, "Kelas", d.kelas);

  if (isGuru && d.mapel) {
    tambahBaris(rincian, "Mata pelajaran", d.mapel);
  }

  if (TAMPILKAN.jenisKelamin) {
    tambahBaris(rincian, "Jenis kelamin", d.jenis_kelamin);
  }

  if (TAMPILKAN.tanggalLahir) {
    tambahBaris(
      rincian,
      "Tanggal lahir",
      formatTanggal(d.tanggal_lahir)
    );
  }

  if (TAMPILKAN.alamat) {
    tambahBaris(rincian, "Alamat", d.alamat);
  }

  isi.appendChild(rincian);
  kartu.appendChild(isi);

  return kartu;
}

// ===== FUNGSI PENDUKUNG =====
function el(tag, kelas, teks) {
  const elemen = document.createElement(tag);

  if (kelas) elemen.className = kelas;

  if (teks !== undefined && teks !== null) {
    elemen.textContent = teks;
  }

  return elemen;
}

function tambahBaris(dl, label, nilai) {
  if (nilai === undefined || nilai === null || nilai === "") return;

  const baris = el("div");
  baris.appendChild(el("dt", "", label));
  baris.appendChild(el("dd", "", String(nilai)));
  dl.appendChild(baris);
}

function normal(teks) {
  return String(teks || "").trim().toLowerCase();
}

function inisial(nama) {
  return String(nama || "?")
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map(kata => kata[0].toUpperCase())
    .join("");
}

function formatTanggal(teks) {
  if (!teks) return "";

  const tanggal = new Date(teks + "T00:00:00");

  if (Number.isNaN(tanggal.getTime())) return teks;

  return tanggal.toLocaleDateString("id-ID", {
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

function tampilkanPesan(teks, galat = false) {
  elDaftar.replaceChildren(
    el("p", "pesan" + (galat ? " galat" : ""), teks)
  );
}

// ===== AKSI FILTER =====
elCari.addEventListener("input", tampilkanData);
elRole.addEventListener("change", tampilkanData);
elKelas.addEventListener("change", tampilkanData);
elMapel.addEventListener("change", tampilkanData);

// ===== JALANKAN WEBSITE =====
muatData();
</script>
</body>
</html>
